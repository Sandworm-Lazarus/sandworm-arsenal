name: Validate arsenal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out catalog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-11
        with:
          persist-credentials: false
      - name: Validate catalog and generated documents
        run: python3 scripts/arsenal.py check
      - name: Run catalog, generator and original utility regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Test each original standalone project
        run: python3 scripts/check_originals.py
      - name: Generate and validate all focused collections
        run: python3 scripts/build_collections.py --output-root "${RUNNER_TEMP}/focused-collections"
      - name: Verify synthetic privacy fixture report
        run: python3 scripts/check_privacy_fixtures.py --check-report examples/privacy-guard-results.json
